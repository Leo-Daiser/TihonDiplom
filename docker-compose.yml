services:
  app:
    build: .
    container_name: tihon_diplom_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    container_name: tihon_diplom_db
    environment:
      POSTGRES_DB: tihon_diplom
      POSTGRES_USER: tihon_user
      POSTGRES_PASSWORD: tihon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tihon_user -d tihon_diplom"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tihon_diplom_minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --address ":9000" --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
