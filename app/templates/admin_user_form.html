{% extends "base.html" %}
{% block title %}{{ page_title }} — IT Workflow{% endblock %}
{% block content %}
{% set selected_role = edited_user.role.code if edited_user else 'worker' %}
<section class="page-head">
  <div>
    <p class="eyebrow">Администрирование</p>
    <h1>{{ page_title }}</h1>
  </div>
  <a class="secondary-link" href="/admin/users">К списку</a>
</section>

<section class="panel form-panel">
  <form method="post" action="{{ form_action }}" class="form-grid">
    {% if not edited_user %}
    <label>
      <span>Email</span>
      <input type="email" name="email" required placeholder="user@example.com">
    </label>
    {% else %}
    <label>
      <span>Email</span>
      <input type="email" value="{{ edited_user.email }}" disabled>
    </label>
    {% endif %}

    <label>
      <span>ФИО</span>
      <input type="text" name="full_name" required value="{{ edited_user.full_name if edited_user else '' }}">
    </label>

    <label>
      <span>{% if edited_user %}Новый пароль{% else %}Пароль{% endif %}</span>
      <input type="password" name="password" {% if not edited_user %}required{% endif %} minlength="8" placeholder="{% if edited_user %}Оставь пустым, чтобы не менять{% else %}Минимум 8 символов{% endif %}">
    </label>

    <label>
      <span>Роль</span>
      <select name="role_code" required>
        {% for role in roles %}
        <option value="{{ role.code }}" {% if selected_role == role.code %}selected{% endif %}>{{ role.name }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="wide checkbox-row">
      <input type="checkbox" name="is_active" {% if edited_user is none or edited_user.is_active %}checked{% endif %}>
      <span>Учетная запись активна</span>
    </label>

    <div class="form-actions wide">
      <button type="submit">{{ submit_label }}</button>
    </div>
  </form>
</section>
{% endblock %}
